# Uncomment these two line to add support for encoders to your firmware
CONFIG_ZMK_POINTING=y
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Uncomment the following line to enable the KLOR OLED Display
#CONFIG_ZMK_DISPLAY=n

# Uncomment the following lines to enable per key RGB
CONFIG_ZMK_RGB_UNDERGLOW=n

#CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=40
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=1

CONFIG_BT_BAS=y
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# Enable deep sleep
CONFIG_ZMK_SLEEP=y

# Go to idle state after 30 seconds (dims/turns off LEDs)
CONFIG_ZMK_IDLE_TIMEOUT=30000

# Go to deep sleep after 5 minutes (disconnects Bluetooth)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=300000
